# Checks that need the public internet (real DNS, SEC EDGAR). They report
# facts; they do not deploy anything.
name: External checks

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/external-checks.yml"
      - "backend/app/services/sec_facts.py"
      - "backend/scripts/verify_sec_periods.py"

permissions:
  contents: read

jobs:
  hosting:
    name: DNS and HTTP for finsavoir.com
    runs-on: ubuntu-latest
    steps:
      - name: DNS records
        run: |
          for host in finsavoir.com www.finsavoir.com api.finsavoir.com; do
            for type in NS SOA A AAAA CNAME; do
              echo "--- $host $type"
              dig +noall +answer +authority "$host" "$type" @1.1.1.1 || true
            done
          done
          echo "--- registry (whois summary)"
          whois finsavoir.com 2>/dev/null | grep -iE "registrar:|name server|creation date|expir|status" | head -20 || true
      - name: HTTP responses
        run: |
          for url in https://finsavoir.com/ https://www.finsavoir.com/ https://api.finsavoir.com/; do
            echo "--- $url"
            # All response headers except cookies.
            curl -sS -o /dev/null -D - --max-time 20 "$url" | grep -viE "^set-cookie" || echo "(no response)"
          done
      - name: Identify the deployed codebase
        run: |
          curl -sS --max-time 20 https://finsavoir.com/ -o home.html || exit 0
          echo "--- <title> and description"
          grep -oE "<title>[^<]*</title>" home.html | head -3
          grep -oE '<meta name="description" content="[^"]*"' home.html | head -3
          echo "--- markers of this repository (akshatve/FinSavoir)"
          for m in "logo/logo2.png" "Know the Business" "FinSavoir AI" "FinLens" "Trusted by 10,000+" "Free · Built on SEC EDGAR filings"; do
            printf '%-40s %s\n' "$m" "$(grep -c -F "$m" home.html)"
          done
          echo "--- API origins compiled into the JS bundles"
          grep -oE '/_next/static/[^"]+\.js' home.html | sort -u | head -60 > chunks.txt
          wc -l < chunks.txt
          while read -r c; do curl -sS --max-time 20 "https://finsavoir.com$c"; echo; done < chunks.txt > bundle.js
          grep -oE 'https?://[a-zA-Z0-9.-]+(:[0-9]+)?' bundle.js | grep -viE "w3\.org|reactjs|nextjs\.org|github\.com|tradingview|youtube|unsplash|picsum|financialmodelingprep\.com/image|sec\.gov|fonts\.|schema\.org|vercel\.app" | sort | uniq -c | sort -rn | head -20
          grep -oE '127\.0\.0\.1:8000|localhost:8000' bundle.js | sort | uniq -c

  sec-periods:
    name: Verify SEC fiscal-year mapping against filings
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/verify_sec_periods.py AAPL MSFT NVDA KO JPM WMT
